<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no" />
    <title>SkyCine TV</title>
    <!-- Samsung Tizen WebAPIs -->
    <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      /* Ensure background transparency for native Samsung AVPlay video hole-punching */
      html, body {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #07090e;
        color: #f1f5f9;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      /* TV Video Overlay Container for Samsung AVPlay */
      #av-player-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        z-index: 0;
        pointer-events: none;
        background: transparent;
      }
      /* Custom TV Scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(229, 169, 60, 0.4);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(229, 169, 60, 0.8);
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none !important;
      }
      .no-scrollbar {
        -ms-overflow-style: none !important;
        scrollbar-width: none !important;
      }
    </style>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <!-- Hardware video plane placeholder for Tizen AVPlay -->
    <div id="av-player-container" style="display: none;"></div>
    
    <!-- React App Root -->
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
